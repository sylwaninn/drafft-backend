# Checks every change; ships main to staging and v* tags to production, then checks for drift.
#
#   pull request      → code, database and migration checks
#   push to main      → checks, deploy to staging, drift check
#   push of a v* tag  → checks, deploy to production (the environment only accepts v* tags), drift check
#
# Migrations and Edge Functions only: secrets stay in the local .env files (`deploy.sh <env> --secrets`).
name: backend

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned: `latest` asks GitHub's API for the release and hits its rate limit. Same as local.
  # drift.yml reads this line: keep it `SUPABASE_CLI: <version>`.
  SUPABASE_CLI: 2.90.0

jobs:
  code:
    name: code (format, lint, types, shell, workflows, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno fmt --check supabase/functions scripts
      - name: Lint
        run: deno lint supabase/functions scripts
      - name: Type-check Edge Functions
        working-directory: supabase/functions
        run: deno check ./*/index.ts
      - name: Type-check scripts
        run: deno check scripts/*.ts
      - name: Unit and Edge Function auth tests (no network)
        working-directory: supabase/functions
        run: deno test --allow-env --allow-read=.
      - name: Shell scripts
        run: shellcheck -S warning scripts/*.sh scripts/ci/*.sh
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Secrets (whole history)
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.28.0 git --no-banner --config .gitleaks.toml --redact .

  database:
    name: database (tests, schema lint, advisors)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI }}
      - name: Start a database from the migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Tests (pgTAP)
        run: supabase test db
      - name: Schema lint (plpgsql_check)
        run: supabase db lint --local -s public,private --level warning --fail-on error
      - name: Security and performance advisors
        run: supabase db advisors --local --level info -o json | python3 scripts/ci/advisors.py

  migrations:
    name: migrations (immutable, ordered, safe)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard
        env:
          BASE: origin/${{ github.base_ref }}
        run: scripts/ci/migrations-guard.sh "$BASE"

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [code, database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # env-parity reads the last release tag's advisors baseline
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI }}
      - name: Deploy to staging
        run: scripts/deploy.sh staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Drift (production may lag until the next tag)
        run: scripts/ci/env-parity.sh --allow-prod-behind
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [code, database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI }}
      - name: Deploy to production
        # The tag is the confirmation deploy.sh asks for.
        run: echo production | scripts/deploy.sh production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Drift
        run: scripts/ci/env-parity.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
