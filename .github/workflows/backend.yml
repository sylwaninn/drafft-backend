# Checks every change; every merge to staging ships to staging; a release tag ships to production.
#
#   pull request      → title, code, database and migration checks
#   push to staging   → checks, deploy to staging, drift check (production may lag until the next release)
#   v* tag            → checks, deploy to production, drift check. release.yml starts it on the tag it
#                       creates (Actions > release); Run workflow on an older tag (or pushing a v* tag by
#                       hand) redeploys or rolls back to that version.
#
# Flow: feature branch → pull request into staging → release.yml (staging → main, tag, deploy).
#
# Each deploy ships the media Worker (cloudflare/media-worker) too, after the Edge Functions: the functions
# delete the photo renditions the Worker keeps, so they go first. Needs the CLOUDFLARE_API_TOKEN secret
# (Workers Scripts edit, Workers R2 Storage read, Workers Routes edit on getdrafft.com) and the
# CLOUDFLARE_ACCOUNT_ID variable.
#
# Version (scripts/ci/release.sh): from the released pull request titles, `type!:` major, `feat` minor,
# anything else patch.
#
# Migrations and Edge Functions only: secrets stay in the local .env files (`deploy.sh <env> --secrets`).
name: backend

on:
  pull_request:
  push:
    branches: [staging]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned: `latest` asks GitHub's API for the release and hits its rate limit. Same as local.
  # drift.yml reads this line: keep it `SUPABASE_CLI: <version>`.
  SUPABASE_CLI: 2.90.0
  # The media Worker's deploy tool, pinned like the CLI.
  WRANGLER: 4.146.0

jobs:
  title:
    name: title (conventional, sets the version bump)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next version
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "Alone, this change would release $(scripts/ci/next-version.sh "$TITLE")" >> "$GITHUB_STEP_SUMMARY"

  code:
    name: code (format, lint, types, shell, workflows, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno fmt --check supabase/functions scripts cloudflare
      - name: Lint
        run: deno lint supabase/functions scripts cloudflare
      - name: Type-check Edge Functions
        working-directory: supabase/functions
        run: deno check ./*/index.ts
      - name: Type-check scripts
        run: deno check scripts/*.ts
      - name: Media Worker (types, signature and serving tests)
        run: deno check cloudflare/media-worker/src/*.ts && deno test cloudflare/media-worker
      - name: Support mail Worker (types, parsing and filing tests)
        run: |
          deno check --config cloudflare/support-mail-worker/deno.json cloudflare/support-mail-worker/src/*.ts
          deno test --config cloudflare/support-mail-worker/deno.json cloudflare/support-mail-worker
      - name: Unit and Edge Function auth tests (no network)
        working-directory: supabase/functions
        run: deno test --allow-env --allow-read=.,../../WORDING.md
      - name: Shell scripts
        run: shellcheck -S warning scripts/*.sh scripts/ci/*.sh
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Secrets (whole history)
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.28.0 git --no-banner --config .gitleaks.toml --redact .

  database:
    name: database (tests, schema lint, advisors)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI }}
      - name: Start a database from the migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Tests (pgTAP)
        run: supabase test db
      - name: Schema lint (plpgsql_check)
        run: supabase db lint --local -s public,private --level warning --fail-on error
      - name: Security and performance advisors
        run: supabase db advisors --local --level info -o json | python3 scripts/ci/advisors.py

  migrations:
    name: migrations (immutable, ordered, safe)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard
        env:
          BASE: origin/${{ github.base_ref }}
        run: scripts/ci/migrations-guard.sh "$BASE"

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [code, database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # env-parity reads the last release tag's advisors baseline
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI }}
      - uses: denoland/setup-deno@v2 # deploy.sh loads the areas (scripts/load-areas.ts)
        with:
          deno-version: v2.x
      - name: Deploy to staging
        run: scripts/deploy.sh staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy the media Worker to staging
        working-directory: cloudflare/media-worker
        run: npx --yes "wrangler@$WRANGLER" deploy --env staging --message "ci ${COMMIT::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ github.sha }}
      - name: Drift (production may lag until the next tag)
        run: scripts/ci/env-parity.sh --allow-prod-behind
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [code, database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI }}
      - uses: denoland/setup-deno@v2 # deploy.sh loads the areas (scripts/load-areas.ts)
        with:
          deno-version: v2.x
      - name: Deploy to production
        # deploy.sh production only runs here, on a v* tag (release.yml, or a hand-picked version).
        run: scripts/deploy.sh production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy the media Worker to production
        working-directory: cloudflare/media-worker
        run: npx --yes "wrangler@$WRANGLER" deploy --env production --message "ci ${COMMIT::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ github.sha }}
      - name: Drift
        run: scripts/ci/env-parity.sh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
