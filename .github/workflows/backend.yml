# Checks every change; ships main to staging and v* tags to production.
#
#   pull request      → checks
#   push to main      → checks, then scripts/deploy.sh staging
#   push of a v* tag  → checks, then scripts/deploy.sh production (the `production` environment only
#                       accepts v* tags)
#
# Migrations and Edge Functions only: secrets stay in the local .env files (`deploy.sh <env> --secrets`).
name: backend

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        working-directory: supabase/functions
        run: deno check */index.ts
      - name: Type-check scripts
        run: deno check scripts/*.ts
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` asks GitHub's API for the release and hits its rate limit. Same as local.
          version: 2.90.0
      - name: Database tests
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector
          supabase test db

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0
      - name: Deploy to staging
        run: scripts/deploy.sh staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0
      - name: Deploy to production
        # The tag is the confirmation deploy.sh asks for.
        run: echo production | scripts/deploy.sh production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
