# Daily: catches what changed outside git (dashboard toggles, hand-run SQL, secrets set on one side).
name: drift

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0
      - name: Staging and production match the repository
        run: scripts/ci/env-parity.sh --allow-prod-behind
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
