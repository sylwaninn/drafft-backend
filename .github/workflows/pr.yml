# Checks the pull request itself: base branch, title, description, commit authors and messages
# (scripts/ci/pr_check.sh). Runs again when the title or the description is edited.
name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read # read GitHub's signature verification of the commits

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    name: pr (base, title, description, commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull request rules
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # Commit authors allowed in this repository (GitHub's noreply address of each maintainer, and Dependabot).
          ALLOWED_EMAILS: 147426984+sylwaninn@users.noreply.github.com 49699333+dependabot[bot]@users.noreply.github.com
          # true only in drafft-web, which has no staging and takes its pull requests into main.
          ALLOW_MAIN_BASE: "false"
          # true once every maintainer signs their commits (drafft-ios CONTRIBUTING.md > Signed commits).
          REQUIRE_SIGNED: "false"
        run: scripts/ci/pr_check.sh
